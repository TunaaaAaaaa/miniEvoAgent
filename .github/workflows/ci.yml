name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minievo_test
          POSTGRES_PASSWORD: minievo_test
          POSTGRES_DB: minievo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minievo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://minievo_test:minievo_test@localhost:5432/minievo_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install --upgrade --editable ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy evo_repro tests

      - name: Test with coverage
        run: python -m pytest --cov=evo_repro --cov-report=term-missing --cov-fail-under=85 -q
