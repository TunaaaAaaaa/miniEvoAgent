[project]
name = "evo-repro"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1",
    "pydantic>=2",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1",
]

[project.optional-dependencies]
benchmarks = [
    "evoagentx>=0.1",
]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["evo_repro", "tests"]
pretty = true
show_error_codes = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
